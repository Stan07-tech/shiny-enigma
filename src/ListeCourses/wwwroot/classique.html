<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste de courses</title>
  <style>
    :root { color-scheme: light; --fond: #f6f7f9; --carte: #fff; --texte: #1f2328; --doux: #6b7280; --accent: #2f7d4f; --bord: #e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--fond); color: var(--texte); }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 16px; font-size: 1.6rem; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); }
    #nom { flex: 1 1 180px; }
    #quantite { width: 72px; }
    #rayon { flex: 0 1 140px; }
    button { cursor: pointer; }
    button.principal { background: var(--accent); color: #fff; border-color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; overflow: hidden; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--bord); }
    li:first-child { border-top: none; }
    li.achete .nom { text-decoration: line-through; color: var(--doux); }
    .nom { flex: 1; }
    .rayon { font-size: .8rem; color: var(--doux); }
    .suppr { border: none; background: none; color: var(--doux); font-size: 1.1rem; padding: 4px 8px; }
    .vide { padding: 24px; text-align: center; color: var(--doux); }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--doux); font-size: .9rem; }
  </style>
</head>
<body>
<main>
  <h1>🛒 Liste de courses</h1>

  <form id="ajout">
    <input id="nom" placeholder="Article (ex. : pain)" required maxlength="100" autocomplete="off">
    <input id="quantite" type="number" min="1" value="1" aria-label="Quantité">
    <input id="rayon" placeholder="Rayon" maxlength="50">
    <button class="principal">Ajouter</button>
  </form>

  <ul id="liste"></ul>

  <footer>
    <span id="compteur"></span>
    <button id="vider">Retirer les articles achetés</button>
  </footer>
</main>

<script>
  const api = '/api/articles';
  const liste = document.getElementById('liste');

  async function charger() {
    const articles = await (await fetch(api)).json();
    liste.innerHTML = '';
    if (articles.length === 0) {
      liste.innerHTML = '<li class="vide">La liste est vide.</li>';
    }
    for (const a of articles) {
      const li = document.createElement('li');
      li.className = a.achete ? 'achete' : '';
      li.innerHTML = `
        <input type="checkbox" ${a.achete ? 'checked' : ''}>
        <span class="nom"></span>
        <span class="rayon"></span>
        <button class="suppr" title="Supprimer">✕</button>`;
      li.querySelector('.nom').textContent = a.quantite > 1 ? `${a.nom} × ${a.quantite}` : a.nom;
      li.querySelector('.rayon').textContent = a.rayon ?? '';
      li.querySelector('input').onchange = () => appeler(`${api}/${a.id}/basculer`, 'PATCH');
      li.querySelector('.suppr').onclick = () => appeler(`${api}/${a.id}`, 'DELETE');
      liste.appendChild(li);
    }
    const restants = articles.filter(a => !a.achete).length;
    document.getElementById('compteur').textContent =
      `${restants} article${restants > 1 ? 's' : ''} restant${restants > 1 ? 's' : ''}`;
  }

  async function appeler(url, methode) {
    await fetch(url, { method: methode });
    await charger();
  }

  document.getElementById('ajout').onsubmit = async (e) => {
    e.preventDefault();
    const nom = document.getElementById('nom');
    const rayon = document.getElementById('rayon');
    const quantite = document.getElementById('quantite');
    await fetch(api, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nom: nom.value, quantite: Number(quantite.value), rayon: rayon.value || null })
    });
    nom.value = ''; quantite.value = 1;
    nom.focus();
    await charger();
  };

  document.getElementById('vider').onclick = () => appeler(`${api}/achetes`, 'DELETE');

  charger();
</script>
</body>
</html>
